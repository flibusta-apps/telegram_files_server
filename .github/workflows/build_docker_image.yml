name: Build docker image

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  Build-Docker-Image:
    needs: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set lowercase image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ env.IMAGE }}:latest,ghcr.io/${{ env.IMAGE }}:${{ github.sha }}
          context: .
          file: ./docker/production.dockerfile

      - name: Invoke deployment hook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TAG: ${{ github.sha }}
        run: curl -fsS --retry 3 --max-time 30 -X POST "${WEBHOOK_URL}?FILES_SERVER_TAG=${TAG}"
